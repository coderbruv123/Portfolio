<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mock 01 — Split-text hero</title>
<style>
  :root { --bg:#020617; --ink:#fff; --ink2:#d1d5db; --ink3:#9ca3af; --blue:#60a5fa; --purple:#a78bfa; --cyan:#22d3ee;
          --panel:rgb(15 23 42/.8); --line:rgb(255 255 255/.1); --h1a:#fff; --h1b:#c9d6ff; }
  html.light { --bg:#f2f5fb; --ink:#0f172a; --ink2:#374151; --ink3:#566076; --blue:#2563eb; --purple:#7c3aed; --cyan:#0891b2;
          --panel:rgb(255 255 255/.8); --line:rgb(15 23 42/.1); --h1a:#0f172a; --h1b:#2563eb; }
  body { transition:background-color .35s ease, color .35s ease; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center;
    background:radial-gradient(ellipse 60% 50% at 70% 20%, rgb(96 165 250 / .12), transparent), var(--bg);
    color:var(--ink); font-family:Inter, ui-sans-serif, system-ui, sans-serif; overflow:hidden;
  }
  .chip {
    position:fixed; top:14px; left:14px; z-index:99; font-size:11px; letter-spacing:.04em;
    background:var(--panel); border:1px solid var(--line); color:var(--ink3);
    padding:7px 12px; border-radius:999px; backdrop-filter:blur(8px);
  }
  .chip code { color:var(--blue); }
  .theme-btn {
    position:fixed; top:12px; right:12px; z-index:99; margin:0; font-size:12px; font-weight:600;
    color:var(--ink); background:var(--panel); border:1px solid var(--line); border-radius:999px;
    padding:8px 14px; box-shadow:none; backdrop-filter:blur(8px);
  }
  .theme-btn:hover { background:var(--panel); border-color:var(--blue); transform:translateY(-1px); }
  main { text-align:center; padding:0 24px; }
  .hello {
    display:flex; align-items:center; justify-content:center; gap:10px;
    color:var(--blue); font-weight:500; margin:0 0 12px;
  }
  .hello::before { content:""; height:1px; width:32px; background:var(--blue); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scaleX(.5);opacity:.5} 50%{transform:scaleX(1);opacity:1} }

  /* Mask container so letters rise out of an invisible line */
  .mask { overflow:hidden; padding:0 6px 12px; perspective:600px; }
  h1 {
    margin:0; font-size:clamp(44px, 8vw, 84px); font-weight:800; letter-spacing:-.03em; line-height:1.05;
  }
  .ltr {
    display:inline-block; will-change:transform;
    transform:translateY(115%) rotateX(-75deg); opacity:0;
    transition:transform 1s cubic-bezier(.16,1,.3,1), opacity .8s ease;
    background:linear-gradient(90deg, var(--h1a), var(--h1b));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .role {
    margin:6px 0 0; font-size:clamp(16px,2.4vw,24px); font-weight:600; min-height:2rem;
    background:linear-gradient(90deg, var(--blue), var(--purple), var(--cyan)); background-size:200% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:shimmer 4s linear infinite; opacity:0; transition:opacity .8s ease .9s;
  }
  @keyframes shimmer { to { background-position:-200% 0; } }
  .tag { margin-top:28px; font-size:12px; color:var(--ink3); opacity:0; transition:opacity .8s ease 1.3s; }
  body.played .role, body.played .tag { opacity:1; }
  button {
    margin-top:34px; font:inherit; font-size:13px; font-weight:600; color:#fff;
    background:#2563eb; border:0; border-radius:10px; padding:10px 20px; cursor:pointer;
    box-shadow:0 8px 24px rgb(37 99 235/.35); transition:transform .15s ease, background .15s ease;
  }
  button:hover { background:#3b82f6; transform:translateY(-2px); }
</style>
</head>
<body>
  <div class="chip">MOCK 01 / 10 &nbsp;·&nbsp; Split-text hero &nbsp;→&nbsp; <code>src/sections/Hero.tsx</code></div>
  <button class="theme-btn" id="themeBtn">☀️ Light</button>
  <main>
    <p class="hello">Hello, I'm</p>
    <div class="mask"><h1 id="name">Prashant Giri</h1></div>
    <p class="role">Full Stack Developer · .NET Core · Angular · React</p>
    <p class="tag">Per-letter spring stagger (Motion for React's <code>SplitText</code>, or ~40 lines of vanilla here)</p>
    <button id="replay">↻ Replay</button>
  </main>
<script>
  const el = document.getElementById('name');
  function play() {
    document.body.classList.remove('played');
    const text = 'Prashant Giri';
    el.innerHTML = '';
    [...text].forEach((ch, i) => {
      const s = document.createElement('span');
      s.className = 'ltr';
      s.textContent = ch === ' ' ? '\u00A0' : ch;
      s.style.transitionDelay = (i * 45) + 'ms';
      el.appendChild(s);
    });
    requestAnimationFrame(() => requestAnimationFrame(() => {
      document.body.classList.add('played');
      el.querySelectorAll('.ltr').forEach(s => {
        s.style.transform = 'translateY(0) rotateX(0)';
        s.style.opacity = '1';
      });
    }));
  }
  document.getElementById('replay').addEventListener('click', play);
  window.addEventListener('keydown', e => { if (e.key === 'r') play(); });
  const tb = document.getElementById('themeBtn');
  tb.addEventListener('click', () => {
    const light = document.documentElement.classList.toggle('light');
    tb.textContent = light ? '🌙 Dark' : '☀️ Light';
  });
  play();
</script>
</body>
</html>
